<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>IMAC Qualidade</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script defer crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script defer crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script defer src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

  <script defer src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --white: #ffffff;
      --bg: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-2: #475569;
      --text-3: #94a3b8;
      --primary: #1e3a8a; /* Deep blue for premium feel */
      --primary-light: #eff6ff;
      --primary-dark: #172554;
      --amber: #f59e0b;
      --amber-light: #fef3c7;
      --amber-dark: #d97706;
      --green: #16a34a;
      --green-light: #dcfce7;
      --red: #dc2626;
      --red-light: #fee2e2;
      --sidebar-w: 260px;
      --header-h: 64px;
      --radius: 12px;
      --radius-sm: 6px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
      line-height: 1.6;
      font-size: 14px;
    }

    #root { display: flex; height: 100dvh; overflow: hidden; }

    /* SCROLLBAR */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* SIDEBAR */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--primary);
      color: var(--white);
      border-right: none;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      height: 100dvh;
      overflow: hidden;
      box-shadow: 2px 0 12px rgba(0,0,0,0.1);
    }
    .sidebar-logo {
      height: var(--header-h);
      padding: 0 24px;
      display: flex;
      align-items: center;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.5px;
      color: var(--white);
      background: var(--primary-dark);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .sidebar-logo span { color: var(--amber); margin-left: 6px; }
    .sidebar-nav { flex: 1; padding: 24px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .nav-section { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.1em; padding: 12px 16px 8px; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 500;
      color: rgba(255,255,255,0.8);
      cursor: pointer;
      transition: all .2s ease;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }
    .nav-item:hover { background: rgba(255,255,255,0.1); color: var(--white); transform: translateX(2px); }
    .nav-item.active { background: var(--amber); color: var(--white); font-weight: 600; box-shadow: 0 4px 12px rgba(245,158,11,0.3); }
    .nav-item svg { flex-shrink: 0; opacity: .8; stroke-width: 2.5; }
    .nav-item.active svg { opacity: 1; }
    .sidebar-footer { padding: 16px; border-top: 1px solid rgba(255,255,255,0.1); }

    /* MAIN */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
    .topbar {
      height: var(--header-h);
      background: var(--white);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 32px;
      gap: 16px;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
      z-index: 10;
    }
    .topbar-title { font-size: 18px; font-weight: 700; color: var(--text); flex: 1; letter-spacing: -0.3px; }
    .mobile-menu-btn { display: none; background: none; border: none; cursor: pointer; padding: 8px; border-radius: var(--radius-sm); color: var(--text-2); transition: background .2s; }
    .mobile-menu-btn:hover { background: var(--bg); }

    .page { flex: 1; overflow-y: auto; padding: 32px; scroll-behavior: smooth; }
    .page-inner { max-width: 1000px; margin: 0 auto; }

    /* PROGRESS BAR (inspeção) */
    .progress-bar-track {
      height: 6px;
      background: var(--border);
      flex-shrink: 0;
      position: relative;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--primary);
      transition: width .5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* CARDS */
    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      transition: box-shadow .3s ease, transform .3s ease;
    }
    .card:hover {
      box-shadow: var(--shadow-md);
    }
    .card-p { padding: 24px; }
    .card-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(248, 250, 252, 0.5);
      border-radius: var(--radius) var(--radius) 0 0;
    }
    .card-title { font-size: 16px; font-weight: 700; color: var(--text); letter-spacing: -0.2px; }

    /* GRID */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
    .stack { display: flex; flex-direction: column; gap: 12px; }
    .row { display: flex; align-items: center; gap: 12px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

    /* FORM ELEMENTS */
    label.field-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 8px;
    }
    input[type="text"], input[type="date"], input[type="number"], select, textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      background: var(--white);
      outline: none;
      transition: all .2s ease;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.02);
    }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1); }
    textarea { resize: vertical; min-height: 80px; }

    /* BUTTONS */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all .2s ease;
      line-height: 1;
      font-family: inherit;
    }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 2px 4px rgba(30, 58, 138, 0.2); }
    .btn-primary:hover:not(:disabled) { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 4px 6px rgba(30, 58, 138, 0.3); }
    .btn-ghost { background: transparent; color: var(--text-2); border-color: var(--border); }
    .btn-ghost:hover:not(:disabled) { background: var(--bg); color: var(--text); border-color: #cbd5e1; }
    .btn-danger { background: transparent; color: var(--red); border-color: var(--red-light); }
    .btn-danger:hover:not(:disabled) { background: var(--red); color: white; border-color: var(--red); }
    .btn-sm { padding: 8px 14px; font-size: 13px; }
    .btn-icon { padding: 8px; }

    /* TAGS / BADGES */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .badge-amber { background: var(--amber-light); color: var(--amber-dark); }
    .badge-green { background: var(--green-light); color: var(--green); }
    .badge-red { background: var(--red-light); color: var(--red); }
    .badge-blue { background: var(--blue-light); color: var(--blue); }
    .badge-gray { background: var(--bg); color: var(--text-2); }

    /* ANSWER BUTTONS */
    .answer-btn {
      flex: 1;
      padding: 12px 10px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border: 2px solid var(--border);
      background: var(--white);
      color: var(--text-2);
      text-align: center;
      transition: all .2s ease;
      font-family: inherit;
      box-shadow: var(--shadow-sm);
    }
    .answer-btn:hover { border-color: var(--text-3); color: var(--text); background: var(--bg); transform: translateY(-1px); }
    .answer-btn.selected-C { background: var(--green); border-color: var(--green); color: white; box-shadow: 0 4px 10px rgba(22, 163, 74, 0.3); }
    .answer-btn.selected-NC { background: var(--red); border-color: var(--red); color: white; box-shadow: 0 4px 10px rgba(220, 38, 38, 0.3); }
    .answer-btn.selected-NA { background: var(--text-2); border-color: var(--text-2); color: white; box-shadow: 0 4px 10px rgba(71, 85, 105, 0.3); }

    /* INSPECTION QUESTION CARD */
    .q-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      transition: border-color .15s;
    }
    .q-card.is-nc { border-color: #fca5a5; }
    .q-card.is-c { border-color: #86efac; }

    /* SCORE CIRCLE */
    .score-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 800;
      flex-shrink: 0;
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      width: 100%;
      max-width: 480px;
      max-height: 90dvh;
      overflow-y: auto;
    }
    .modal-header {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-title { font-size: 15px; font-weight: 700; }
    .modal-body { padding: 20px; }
    .modal-footer { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }

    /* TOAST */
    .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 999; display: flex; flex-direction: column; gap: 8px; }
    .toast {
      background: var(--text);
      color: var(--white);
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      box-shadow: var(--shadow-md);
      animation: slideUp .25s ease;
      max-width: 320px;
    }
    .toast.success { background: var(--green); }
    .toast.error { background: var(--red); }
    @keyframes slideUp { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* DIVIDER */
    .divider { height: 1px; background: var(--border); margin: 4px 0; }
    hr.section { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

    /* TABLE */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 8px 12px; font-size: 11px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; background: var(--bg); border-bottom: 1px solid var(--border); }
    td { padding: 11px 12px; border-bottom: 1px solid var(--border); color: var(--text-2); vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafafa; }

    /* STAT */
    .stat { display: flex; flex-direction: column; gap: 2px; }
    .stat-value { font-size: 28px; font-weight: 800; color: var(--text); line-height: 1; }
    .stat-label { font-size: 12px; font-weight: 500; color: var(--text-3); }

    /* GROUP HEADER in inspection */
    .group-heading {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text-3);
      padding: 4px 0;
      margin-top: 8px;
    }

    /* EMPTY STATE */
    .empty {
      text-align: center;
      padding: 48px 16px;
      color: var(--text-3);
      font-size: 14px;
    }
    .empty strong { display: block; color: var(--text-2); font-size: 15px; margin-bottom: 4px; }

    /* SIGNATURE PAD */
    .sig-canvas {
      width: 100%;
      height: 160px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: crosshair;
      touch-action: none;
      background: #fafafa;
    }

    /* PROGRESS RING */
    .week-progress {
      background: var(--amber-light);
      border: 1px solid #fde68a;
      border-radius: var(--radius);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .week-progress-pct { font-size: 32px; font-weight: 800; color: var(--amber-dark); line-height: 1; }

    /* DRAG HANDLE */
    .drag-handle { cursor: grab; color: var(--text-3); padding: 2px; }
    .drag-handle:active { cursor: grabbing; }

    /* SYNC INDICATOR */
    .sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
    }
    .sync-ok { background: var(--green-light); color: var(--green); }
    .sync-ing { background: var(--amber-light); color: var(--amber-dark); }
    .sync-err { background: var(--red-light); color: var(--red); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinning { animation: spin .8s linear infinite; }

    /* MOBILE OVERLAY */
    .mobile-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 150; }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0; left: 0; bottom: 0;
        z-index: 160;
        transform: translateX(-100%);
        transition: transform .25s ease;
      }
      .sidebar.open { transform: translateX(0); }
      .mobile-menu-btn { display: flex; }
      .mobile-overlay.visible { display: block; }
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .page { padding: 16px; }
    }

    @media print {
      .sidebar, .topbar, .no-print { display: none !important; }
      .main { overflow: visible; }
      .page { overflow: visible; padding: 0; }
      body { background: white; }
    }

    /* LIGHTBOX */
    .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 500; display: flex; align-items: center; justify-content: center; }
    .lightbox img { max-width: 90vw; max-height: 90vh; object-fit: contain; border-radius: 4px; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

// ─── FIREBASE ─────────────────────────────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyCHTT46hP2gRmui4i6fBXgqZy41AZ4Fr3M",
  authDomain: "checklistqualidade-c6433.firebaseapp.com",
  projectId: "checklistqualidade-c6433",
  storageBucket: "checklistqualidade-c6433.firebasestorage.app",
  messagingSenderId: "807164886454",
  appId: "1:807164886454:web:68deecf57dd843ce431517"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
try {
  db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
} catch(e) {}

// ─── GOOGLE SHEETS SYNC ───────────────────────────────────────────────────────
// Cole aqui a URL do seu Google Apps Script Web App após publicar o script.
// Deixe '' para desabilitar a sincronização com Sheets.
const SHEETS_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbwGkFi3yeFrejgkBHKzshn_nRKKDyMjSCFxxE-EyaIE3GF92db_4pUXWEUNH1ueRIOhcw/exec';

// Monta o objeto auditoria e lista de NCs a partir de um registro de inspeção
const buildSheetsPayload = (inspection, questions) => {
  const inspDate = inspection.data
    ? new Date(inspection.data).toLocaleDateString('pt-BR')
    : '';
  const nota = inspection.bonusScore ?? inspection.score;

  const auditoria = {
    data: inspDate,
    setor: inspection.setor,
    responsavel: inspection.responsavel,
    nota
  };

  const ncs = Object.entries(inspection.respostas || {})
    .filter(([, v]) => v === 'NC')
    .map(([qid]) => {
      const q = questions.find(x => x.id === qid);
      return {
        data: inspDate,
        setor: inspection.setor,
        grupo: q?.grupo || '',
        pergunta: q?.pergunta || qid,
        observacao: inspection.observacoes?.[qid] || '',
        quantidade: inspection.ncQtys?.[qid] || 1
      };
    });

  return { auditoria, ncs };
};

const syncToSheets = async (inspection, questions) => {
  if (!SHEETS_WEBHOOK_URL) return;
  try {
    const { auditoria, ncs } = buildSheetsPayload(inspection, questions);
    await fetch(SHEETS_WEBHOOK_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'append', auditoria, ncs })
    });
  } catch(e) {
    console.warn('Sheets sync error:', e);
  }
};

const migrateHistoryToSheets = async (inspections, questions) => {
  if (!SHEETS_WEBHOOK_URL) return false;
  try {
    const auditorias = [];
    const allNCs = [];
    inspections.forEach(inspection => {
      const { auditoria, ncs } = buildSheetsPayload(inspection, questions);
      auditorias.push(auditoria);
      allNCs.push(...ncs);
    });
    await fetch(SHEETS_WEBHOOK_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'migrate', auditorias, allNCs })
    });
    return true;
  } catch(e) {
    console.warn('Migration error:', e);
    return false;
  }
};

// ─── DB HELPERS ───────────────────────────────────────────────────────────────
const DB = {
  saveQuestion: (q) => db.collection('questions').doc(q.id).set(q),
  deleteQuestion: (id) => db.collection('questions').doc(id).delete(),
  saveQuestionsBatch: async (list) => {
    const batch = db.batch();
    list.forEach(q => batch.set(db.collection('questions').doc(q.id), q));
    return batch.commit();
  },
  saveInspection: (i) => db.collection('inspections').doc(i.id).set(i),
  deleteInspection: (id) => db.collection('inspections').doc(id).delete(),
  saveActionPlan: (p) => db.collection('actionPlans').doc(p.id).set(p),
  deleteActionPlan: (id) => db.collection('actionPlans').doc(id).delete(),
  getConfig: async (k) => {
    const d = await db.collection('config').doc('main').get();
    return d.exists ? d.data()[k] : null;
  },
  setConfig: (k, v) => db.collection('config').doc('main').set({ [k]: v }, { merge: true }),
  savePhoto: (iid, pid, qid, b64) =>
    db.collection('inspections').doc(iid).collection('photos').doc(pid).set({ questionId: qid, data: b64, criadoEm: Date.now() }),
  getPhotos: async (iid) => {
    const snap = await db.collection('inspections').doc(iid).collection('photos').get();
    const m = {};
    snap.docs.forEach(d => { m[d.id] = d.data(); });
    return m;
  },
  deletePhoto: (iid, pid) => db.collection('inspections').doc(iid).collection('photos').doc(pid).delete(),
  deleteAllPhotos: async (iid) => {
    const snap = await db.collection('inspections').doc(iid).collection('photos').get();
    const batch = db.batch();
    snap.docs.forEach(d => batch.delete(d.ref));
    return batch.commit();
  }
};

const SEED_QUESTIONS = [
  { id: "def_1", setor: "ESTOQUE", grupo: "ORGANIZAÇÃO", pergunta: "Produtos organizados e identificados (PVPS)?", critical: true, weight: 3, ordem: 1 },
  { id: "def_2", setor: "ESTOQUE", grupo: "LIMPEZA", pergunta: "Setor limpo (piso/parede/teto/portas)?", critical: true, weight: 3, ordem: 2 },
  { id: "def_3", setor: "ESTOQUE", grupo: "ESTRUTURAL", pergunta: "Paredes e pisos sem rachaduras e bem conservados?", critical: false, weight: 1, ordem: 3 }
];

// ─── UTILS ────────────────────────────────────────────────────────────────────
const getLocalDate = (d = new Date()) => {
  const dt = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
  return dt.toISOString().split('T')[0];
};
const getWeekID = (dateStr, offset = 0) => {
  const d = new Date(dateStr + 'T12:00:00');
  d.setDate(d.getDate() + offset * 7);
  const day = d.getDay(), diff = d.getDate() - day + (day === 0 ? -6 : 1);
  const mon = new Date(d.setDate(diff));
  return `${mon.getFullYear()}-W${String(Math.ceil((((mon - new Date(mon.getFullYear(), 0, 1)) / 86400000) + 1) / 7)).padStart(2, '0')}`;
};

// ─── TOAST CONTEXT ────────────────────────────────────────────────────────────
const ToastCtx = React.createContext(null);
const useToast = () => React.useContext(ToastCtx);

function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  const toast = useCallback((msg, type = 'info') => {
    const id = Date.now();
    setToasts(p => [...p, { id, msg, type }]);
    setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 3500);
  }, []);
  return (
    <ToastCtx.Provider value={toast}>
      {children}
      <div className="toast-container">
        {toasts.map(t => <div key={t.id} className={`toast ${t.type}`}>{t.msg}</div>)}
      </div>
    </ToastCtx.Provider>
  );
}

// ─── SIGNATURE PAD ────────────────────────────────────────────────────────────
function SignaturePad({ onSave, onCancel, initial }) {
  const ref = useRef(null);
  const drawing = useRef(false);
  useEffect(() => {
    const c = ref.current;
    c.width = c.offsetWidth;
    c.height = c.offsetHeight;
    if (initial) { const img = new Image(); img.onload = () => c.getContext('2d').drawImage(img, 0, 0); img.src = initial; }
  }, []);
  const pos = (e) => {
    const r = ref.current.getBoundingClientRect();
    const s = e.touches ? e.touches[0] : e;
    return [s.clientX - r.left, s.clientY - r.top];
  };
  const start = (e) => {
    e.preventDefault();
    drawing.current = true;
    const ctx = ref.current.getContext('2d');
    ctx.beginPath();
    const [x, y] = pos(e);
    ctx.moveTo(x, y);
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#111';
    ctx.lineCap = 'round';
  };
  const move = (e) => {
    e.preventDefault();
    if (!drawing.current) return;
    const ctx = ref.current.getContext('2d');
    const [x, y] = pos(e);
    ctx.lineTo(x, y);
    ctx.stroke();
  };
  const stop = () => { drawing.current = false; };
  return (
    <div className="modal-overlay">
      <div className="modal" style={{ maxWidth: 420 }}>
        <div className="modal-header">
          <span className="modal-title">Assinatura do Responsável</span>
          <button className="btn btn-ghost btn-sm btn-icon" onClick={onCancel}><I.X /></button>
        </div>
        <div className="modal-body">
          <canvas ref={ref} className="sig-canvas"
            onMouseDown={start} onMouseMove={move} onMouseUp={stop} onMouseLeave={stop}
            onTouchStart={start} onTouchMove={move} onTouchEnd={stop} />
          <p style={{ fontSize: 11, color: 'var(--text-3)', marginTop: 6 }}>Assine dentro do campo acima</p>
        </div>
        <div className="modal-footer">
          <button className="btn btn-ghost btn-sm" onClick={() => { const c = ref.current; c.getContext('2d').clearRect(0, 0, c.width, c.height); }}>Limpar</button>
          <button className="btn btn-ghost btn-sm" onClick={onCancel}>Cancelar</button>
          <button className="btn btn-primary btn-sm" onClick={() => onSave(ref.current.toDataURL())}>Confirmar</button>
        </div>
      </div>
    </div>
  );
}

    if (!authLoaded) return;

    let unQ, unI, unAP;
    const load = async () => {
      setView('loading');
      unQ = db.collection('questions').onSnapshot(snap => {
        const list = snap.docs.map(d => d.data());
        if (list.length === 0 && !window._seeded) {
          window._seeded = true;

  }, [actionPlans, user]);

  // DERIVED
  const currentWeekId = getWeekID(today, weekOffset);
  const allSetors = useMemo(() => [...new Set(questions.map(q => q.setor).filter(s => s !== 'TODOS'))].sort(), [questions]);
  const inspectionsThisWeek = useMemo(() => inspections.filter(i => i.weekId === currentWeekId), [inspections, currentWeekId]);
  const setoresConcluidos = useMemo(() => new Set(inspectionsThisWeek.map(i => i.setor)), [inspectionsThisWeek]);
  const progress = useMemo(() => {
    const total = allSetors.length, done = setoresConcluidos.size;
    return { total, done, pct: total === 0 ? 0 : Math.round((done / total) * 100) };
  }, [allSetors, setoresConcluidos]);

  const currentQuestions = useMemo(() => {
    if (!selectedSetor) return [];
    return questions
      .filter(q => q.setor === selectedSetor || q.setor === 'TODOS')
      .sort((a, b) => a.grupo.localeCompare(b.grupo) || (a.ordem || 999) - (b.ordem || 999));
  }, [selectedSetor, questions]);

  const scores = useMemo(() => {
    if (!currentQuestions.length) return { real: 0, bonus: 0 };
    let tR = 0, cR = 0, tB = 0, cB = 0;
    currentQuestions.forEach(q => {
      const r = answers[q.id];
      if (r && r !== 'NA') {
        const w = q.weight || 1;
        const isStr = q.grupo === 'ESTRUTURAL';
        if (r === 'C') { tR += w; cR += w; tB += w; cB += w; }
        else if (r === 'NC') {
          const qty = ncQtys[q.id] || 1;
          if (isStr) { tR += w; cR += w; tB += w; cB += w; }
          else { tR += w * qty; tB += w * qty; }
        }
      }
    });
    return {
      real: tR === 0 ? 0 : Math.round((cR / tR) * 100),
      bonus: tB === 0 ? 0 : Math.round((cB / tB) * 100)
    };
  }, [answers, ncQtys, currentQuestions]);

  const answeredCount = useMemo(() => Object.keys(answers).filter(id => currentQuestions.some(q => q.id === id)).length, [answers, currentQuestions]);
  const inspProgress = currentQuestions.length === 0 ? 0 : Math.round((answeredCount / currentQuestions.length) * 100);

  // AP STATUS
  const apStatus = (p) => {
    const t = getLocalDate();
    if (p.dataConclusao) return p.dataConclusao <= p.prazo ? 'ok' : 'late_done';
    return t > p.prazo ? 'overdue' : 'pending';
  };
  const apInfo = {
    ok: { label: 'Concluído', cls: 'badge-green' },
    late_done: { label: 'C/ Atraso', cls: 'badge-amber' },
    overdue: { label: 'Atrasado', cls: 'badge-red' },
    pending: { label: 'Em andamento', cls: 'badge-blue' }
  };

  // ── HANDLERS ──────────────────────────────────────────────────────────────

  const handleLogout = () => auth.signOut();

  const handleStartInspection = (setor) => {
    if (!responsavel) { toast('Informe o responsável antes de iniciar.', 'error'); return; }
    setSelectedSetor(setor);
    setAnswers({}); setNcQtys({}); setObs({}); setEvidences({});
    setSignature(null); setEditingInspId(null); setInspSearch('');
    // find prev NCs
    const sorted = inspections.filter(i => i.setor === setor).sort((a, b) => new Date(b.data) - new Date(a.data));
    const last = sorted[0];
    const pnc = {};
    if (last) Object.entries(last.respostas || {}).forEach(([qid, v]) => { if (v === 'NC') pnc[qid] = last.observacoes?.[qid] || ''; });
    setPrevNCs(pnc);
    setView('inspection');
  };

  const savePhotosIfNeeded = async (inspId, evObj) => {
    const result = {};
    for (const [qid, list] of Object.entries(evObj)) {
      const arr = Array.isArray(list) ? list : [list];
      const refs = [];
      for (const img of arr) {
        if (!img) continue;
        if (img.startsWith('ph_')) { refs.push(img); continue; }
        const pid = 'ph_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        await DB.savePhoto(inspId, pid, qid, img);
        refs.push(pid);
      }
      result[qid] = refs;
    }
    return result;
  };

  const handleSaveInspection = async () => {
    const pending = currentQuestions.filter(q => !answers[q.id]);
    if (pending.length > 0 && !confirm(`${pending.length} perguntas sem resposta. Salvar mesmo assim?`)) return;
    if (!signature && !confirm('Salvar sem assinatura?')) return;

    try {
      toast('Salvando...', 'info');
      const inspId = editingInspId || Date.now().toString() + Math.random().toString(36).substr(2, 5);
      const evRefs = await savePhotosIfNeeded(inspId, evidences);

      if (editingInspId) {
        const old = inspections.find(i => i.id === editingInspId);
        if (old) {
          const oldRefs = new Set(Object.values(old.evidencias || {}).flat().filter(r => typeof r === 'string' && r.startsWith('ph_')));
          const newRefs = new Set(Object.values(evRefs).flat());
          for (const r of oldRefs) if (!newRefs.has(r)) await DB.deletePhoto(inspId, r);
        }
      }

      const insp = {
        id: inspId, setor: selectedSetor, responsavel, data: inspDate + 'T12:00:00.000Z',
        weekId: getWeekID(inspDate, 0), score: scores.real, bonusScore: scores.bonus,
        respostas: answers, ncQtys, observacoes: obs, evidencias: evRefs,
        assinatura: signature, status: 'Concluído'
      };
      await DB.saveInspection(insp);

      // Gera planos de ação automáticos para NCs
      const ncs = Object.entries(answers).filter(([,v]) => v === 'NC');
      const prazoDate = new Date(inspDate + 'T12:00:00');
      prazoDate.setDate(prazoDate.getDate() + 7);
      const defaultPrazo = getLocalDate(prazoDate);
      await Promise.all(ncs.map(([qid]) => {
        const autoId = `auto_${inspId}_${qid}`;
        if (actionPlans.some(p => p.id === autoId)) return Promise.resolve();
        const q = questions.find(x => x.id === qid);
        return DB.saveActionPlan({
          id: autoId, setor: selectedSetor, responsavel,
          descricao: `${q?.pergunta || 'Item'}${obs[qid] ? ' — ' + obs[qid] : ''}`,
          prazo: defaultPrazo, dataCriacao: inspDate, dataConclusao: null,
          origem: { tipo: 'auditoria', inspectionId: inspId, questionId: qid }
        });
      }));

      // Sync to Sheets
      setSheetsSyncStatus('syncing');
      syncToSheets(insp, questions)
        .then(() => setSheetsSyncStatus('ok'))
        .catch(() => setSheetsSyncStatus('error'));

      localStorage.removeItem('imac_draft');
      setReportInsp({ ...insp, evidencias: evidences });
      setView('report');
      toast('Inspeção salva!', 'success');
    } catch(e) {
      console.error(e);
      toast('Erro ao salvar: ' + (e.message || e.code || ''), 'error');
    }
  };

  const handleEditInspection = async (insp) => {
    setSelectedSetor(insp.setor); setResponsavel(insp.responsavel);
    const d = insp.data?.includes('T') ? insp.data.split('T')[0] : (insp.data || today);
    setInspDate(d); setAnswers(insp.respostas || {}); setNcQtys(insp.ncQtys || {});
    setObs(insp.observacoes || {}); setSignature(insp.assinatura || null); setEditingInspId(insp.id);
    try {
      const pm = await DB.getPhotos(insp.id);
      const hydrated = {};
      Object.entries(insp.evidencias || {}).forEach(([qid, refs]) => {
        hydrated[qid] = (Array.isArray(refs) ? refs : [refs]).map(r =>
          typeof r === 'string' && r.startsWith('ph_') ? (pm[r]?.data || null) : r
        ).filter(Boolean);
      });
      setEvidences(hydrated);
    } catch(e) { setEvidences({}); }
    setView('inspection');
  };

  const handleViewReport = async (insp) => {
    try {
      const pm = await DB.getPhotos(insp.id);
      const hydrated = {};
      Object.entries(insp.evidencias || {}).forEach(([qid, refs]) => {
        hydrated[qid] = (Array.isArray(refs) ? refs : [refs]).map(r =>
          typeof r === 'string' && r.startsWith('ph_') ? (pm[r]?.data || null) : r
        ).filter(Boolean);
      });
      setReportInsp({ ...insp, evidencias: hydrated });
    } catch(e) { setReportInsp(insp); }
    setView('report');
  };

  const handleDeleteInspection = async (id) => {
    if (!confirm('Apagar esta auditoria permanentemente?')) return;
    await DB.deleteInspection(id);
    await DB.deleteAllPhotos(id).catch(() => {});
    toast('Auditoria apagada.');
  };

  const handlePhotoUpload = (qid, e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const scale = Math.min(1, 1000 / img.width);
        canvas.width = img.width * scale; canvas.height = img.height * scale;
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        let q = 0.7, b64 = canvas.toDataURL('image/jpeg', q);
        while (b64.length > 350000 && q > 0.3) { q -= 0.1; b64 = canvas.toDataURL('image/jpeg', q); }
        setEvidences(p => ({ ...p, [qid]: [...(Array.isArray(p[qid]) ? p[qid] : p[qid] ? [p[qid]] : []), b64] }));
        toast('Foto adicionada.', 'success');
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };

  const handleSaveQuestion = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const q = {
      id: editingQ?.id || Date.now().toString() + Math.random().toString(36).substr(2, 5),
      setor: fd.get('setor').toUpperCase(), grupo: fd.get('grupo').toUpperCase(),
      pergunta: fd.get('pergunta'), critical: fd.get('critical') === 'on',
      weight: parseInt(fd.get('weight')) || 1, ordem: parseInt(fd.get('ordem')) || 999
    };
    await DB.saveQuestion(q);
    setShowQModal(false); setEditingQ(null);
    toast('Pergunta salva.', 'success');
  };

  const handleClone = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const src = fd.get('source'), tgt = fd.get('target').toUpperCase();
    const srcQs = questions.filter(q => q.setor === src);
    if (!srcQs.length) { toast('Setor origem sem perguntas.', 'error'); return; }
    if (allSetors.includes(tgt) && !confirm(`Setor ${tgt} já existe. Continuar mesmo assim?`)) return;
    for (const q of srcQs) {
      await DB.saveQuestion({ ...q, id: Date.now() + Math.random().toString(36).substr(2, 6), setor: tgt });
    }
    setShowCloneModal(false);
    toast(`Setor ${tgt} criado com ${srcQs.length} perguntas.`, 'success');
  };

  const handleSaveAP = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const plan = {
      id: editingAP?.id || Date.now().toString() + Math.random().toString(36).substr(2, 5),
      setor: fd.get('setor').toUpperCase(), descricao: fd.get('descricao'),
      responsavel: fd.get('responsavel'), prazo: fd.get('prazo'),
      dataCriacao: editingAP?.dataCriacao || today, dataConclusao: editingAP?.dataConclusao || null,
      origem: editingAP?.origem || { tipo: 'avulsa' }
    };
    await DB.saveActionPlan(plan);
    setShowAPModal(false); setEditingAP(null);
    toast('Plano salvo.', 'success');
  };

  const handleDrop = async (e, targetQ) => {
    e.preventDefault();
    if (!draggedQ || draggedQ.id === targetQ.id) return;
    const list = questions.filter(q => q.setor === qFilter)
      .sort((a, b) => a.grupo.localeCompare(b.grupo) || (a.ordem || 999) - (b.ordem || 999));
    const from = list.findIndex(q => q.id === draggedQ.id);
    const to = list.findIndex(q => q.id === targetQ.id);
    if (from < 0 || to < 0) return;
    const reordered = [...list];
    reordered.splice(to, 0, reordered.splice(from, 1)[0]);
    const updated = reordered.map((q, i) => ({ ...q, ordem: i + 1 }));
    await DB.saveQuestionsBatch(updated);
    toast('Ordem atualizada.', 'success');
  };

  const handleMigrateToSheets = async () => {
    if (!SHEETS_WEBHOOK_URL) { toast('Configure SHEETS_WEBHOOK_URL no código primeiro.', 'error'); return; }
    setSheetsSyncStatus('syncing');
    const ok = await migrateHistoryToSheets(inspections, questions);
    setSheetsSyncStatus(ok ? 'ok' : 'error');
    toast(ok ? `${inspections.length} auditorias migradas para o Sheets!` : 'Erro na migração.', ok ? 'success' : 'error');
  };

  // ── RENDER ────────────────────────────────────────────────────────────────

  const navTo = (v, extra) => { setView(v); if (extra) extra(); setSidebarOpen(false); };

  const filteredAPs = useMemo(() => actionPlans
    .filter(p => apFilterSetor === 'all' || p.setor === apFilterSetor)
    .filter(p => apFilterStatus === 'all' || apStatus(p) === apFilterStatus)
    .filter(p => !apSearch || p.descricao?.toLowerCase().includes(apSearch.toLowerCase()) || p.setor?.toLowerCase().includes(apSearch.toLowerCase()))
    .sort((a, b) => new Date(a.prazo) - new Date(b.prazo)), [actionPlans, apFilterSetor, apFilterStatus, apSearch]);

  const apCounts = useMemo(() => {
    const c = { total: actionPlans.length, ok: 0, late_done: 0, overdue: 0, pending: 0 };
    actionPlans.forEach(p => c[apStatus(p)]++);
    return c;
  }, [actionPlans]);

  // ── LOADING ──
  if (!authLoaded || view === 'loading') return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100dvh', flexDirection: 'column', gap: 16 }}>
      <div style={{ width: 36, height: 36, border: '3px solid var(--border)', borderTopColor: 'var(--amber)', borderRadius: '50%', animation: 'spin .8s linear infinite' }} />
      <p style={{ color: 'var(--text-3)', fontSize: 13 }}>Carregando...</p>
      {loadingStuck && <button className="btn btn-primary btn-sm" onClick={() => { setAuthLoaded(true); setView('dashboard'); }}>Continuar offline</button>}
    </div>
  );

  // ── LOGIN ──
  if (view === 'login') return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100dvh', background: 'var(--bg)', padding: 16 }}>
      <div className="card card-p" style={{ width: '100%', maxWidth: 360 }}>
        <div style={{ textAlign: 'center', marginBottom: 28 }}>
          <div style={{ fontSize: 24, fontWeight: 800, color: 'var(--text)', marginBottom: 4 }}>
            <span style={{ color: 'var(--amber-dark)' }}>IMAC</span> Qualidade
          </div>
          <p style={{ fontSize: 13, color: 'var(--text-3)' }}>Sistema de Gestão de Qualidade</p>
        </div>
        <button className="btn btn-ghost" style={{ width: '100%', justifyContent: 'center', gap: 10 }}
          onClick={() => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}>
          <I.Google /> Entrar com Google
        </button>
      </div>
    </div>
  );

  // ── VIEWS ──
  const viewLabel = {
    dashboard: 'Painel Inicial', inspection: selectedSetor || 'Auditoria',
    report: 'Relatório', analytics: 'Indicadores', action_plans: 'Planos de Ação',
    settings: settingsTab === 'history' ? 'Histórico' : settingsTab === 'questions' ? 'Banco de Perguntas' : 'Configurações'
  };

  return (
    <React.Fragment>
      {/* MOBILE OVERLAY */}
      {sidebarOpen && <div className="mobile-overlay visible" onClick={() => setSidebarOpen(false)} />}

      {/* SIGNATURE PAD */}
      {isSigning && <SignaturePad initial={signature} onSave={(d) => { setSignature(d); setIsSigning(false); }} onCancel={() => setIsSigning(false)} />}

      {/* LIGHTBOX */}
      <Lightbox src={lightboxSrc} onClose={() => setLightboxSrc(null)} />

      {/* MODALS */}
      {showQModal && <QuestionModal q={editingQ} allSetors={allSetors} onSave={handleSaveQuestion} onClose={() => { setShowQModal(false); setEditingQ(null); }} />}
      {showCloneModal && <CloneModal allSetors={allSetors} onClone={handleClone} onClose={() => setShowCloneModal(false)} />}
      {showAPModal && <ActionPlanModal plan={editingAP} allSetors={allSetors} onSave={handleSaveAP} onClose={() => { setShowAPModal(false); setEditingAP(null); }} />}

      {/* SIDEBAR */}
      <aside className={`sidebar ${sidebarOpen ? 'open' : ''}`}>
        <div className="sidebar-logo">
          {logo ? <img src={logo} style={{ height: 28, objectFit: 'contain' }} /> : <span><span>IMAC</span> Qualidade</span>}
        </div>
        <nav className="sidebar-nav">
          <div className="nav-section">Principal</div>
          <button className={`nav-item ${(view === 'dashboard' || view === 'inspection') ? 'active' : ''}`} onClick={() => navTo('dashboard')}><I.Home /> Painel Inicial</button>
          <button className={`nav-item ${view === 'settings' && settingsTab === 'history' ? 'active' : ''}`} onClick={() => { setSettingsTab('history'); navTo('settings'); }}><I.History /> Histórico</button>
          <button className={`nav-item ${view === 'analytics' ? 'active' : ''}`} onClick={() => navTo('analytics')}><I.Chart /> Indicadores</button>
          <button className={`nav-item ${view === 'action_plans' ? 'active' : ''}`} onClick={() => navTo('action_plans')}>
            <I.Alert /> Planos de Ação {apCounts.overdue > 0 && <span className="badge badge-red" style={{ marginLeft: 'auto', padding: '1px 6px' }}>{apCounts.overdue}</span>}
          </button>
          <div style={{ height: 8 }} />
          <div className="nav-section">Administração</div>
          <button className={`nav-item ${view === 'settings' && settingsTab === 'questions' ? 'active' : ''}`} onClick={() => { setSettingsTab('questions'); navTo('settings'); }}><I.Questions /> Perguntas</button>
          <button className={`nav-item ${view === 'settings' && settingsTab === 'system' ? 'active' : ''}`} onClick={() => { setSettingsTab('system'); navTo('settings'); }}><I.Settings /> Configurações</button>
        </nav>
        <div className="sidebar-footer">
          <button className="nav-item" onClick={handleLogout}><I.Logout /> Sair ({user?.displayName?.split(' ')[0]})</button>
        </div>
      </aside>

      {/* MAIN */}
      <div className="main">
        {/* TOPBAR */}
        <header className="topbar no-print">
          <button className="mobile-menu-btn" onClick={() => setSidebarOpen(true)}><I.Menu /></button>
          <span className="topbar-title">{viewLabel[view] || ''}</span>
          {sheetsSyncStatus !== 'idle' && (
            <span className={`sync-pill ${sheetsSyncStatus === 'syncing' ? 'sync-ing' : sheetsSyncStatus === 'ok' ? 'sync-ok' : 'sync-err'}`}>
              {sheetsSyncStatus === 'syncing' ? <I.Refresh /> : sheetsSyncStatus === 'ok' ? <I.Check /> : <I.X />}
              {sheetsSyncStatus === 'syncing' ? 'Sincronizando' : sheetsSyncStatus === 'ok' ? 'Sheets OK' : 'Sheets erro'}
            </span>
          )}
        </header>

        {/* INSPECTION PROGRESS BAR */}
        {view === 'inspection' && (
          <div className="progress-bar-track no-print">
            <div className="progress-bar-fill" style={{ width: `${inspProgress}%` }} />
          </div>
        )}

        {/* PAGE CONTENT */}
        <div className="page">
          <div className="page-inner">

            {/* ── DASHBOARD ─────────────────────────────────────────── */}
            {view === 'dashboard' && (
              <div className="stack" style={{ gap: 20 }}>
                {/* Progress */}
                <div className="week-progress">
                  <div>
                    <div style={{ fontSize: 13, fontWeight: 700, color: 'var(--amber-dark)', marginBottom: 4 }}>Progresso Semanal</div>
                    <div style={{ fontSize: 13, color: 'var(--amber-dark)', fontWeight: 500 }}>{progress.done} de {progress.total} setores verificados</div>
                  </div>
                  <div className="week-progress-pct">{progress.pct}%</div>
                </div>

                {/* Identification */}
                <div className="card card-p stack" style={{ gap: 14 }}>
                  <div className="card-title">Identificação da Auditoria</div>
                  <div className="grid-2">
                    <div>
                      <label className="field-label">Responsável</label>
                      <input type="text" value={responsavel} onChange={e => setResponsavel(e.target.value)} placeholder="Nome do auditor" />
                    </div>
                    <div>
                      <label className="field-label">Data</label>
                      <input type="date" value={inspDate} onChange={e => setInspDate(e.target.value)} />
                    </div>
                  </div>
                </div>

                {/* Sectors */}
                <div>
                  <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 12 }}>Selecionar Setor</div>
                  <div className="grid-3">
                    {allSetors.length === 0 && <div className="empty" style={{ gridColumn: '1 / -1' }}><strong>Nenhum setor cadastrado</strong>Vá em Perguntas para criar setores.</div>}
                    {allSetors.map(setor => {
                      const done = setoresConcluidos.has(setor);
                      const lastInsp = inspectionsThisWeek.find(i => i.setor === setor);
                      const sc = lastInsp ? (lastInsp.bonusScore ?? lastInsp.score) : null;
                      return (
                        <button key={setor} onClick={() => handleStartInspection(setor)}
                          className="card card-p"
                          style={{ cursor: 'pointer', textAlign: 'left', border: done ? '1px solid #86efac' : '1px solid var(--border)', background: done ? 'var(--green-light)' : 'var(--white)', transition: 'all .15s' }}>
                          <div className="row-between" style={{ marginBottom: 8 }}>
                            <div style={{ fontSize: 11, fontWeight: 700, textTransform: 'uppercase', color: done ? 'var(--green)' : 'var(--text-3)' }}>{setor}</div>
                            {done && <span className="badge badge-green">✓</span>}
                          </div>
                          {sc !== null ? (
                            <div style={{ fontSize: 22, fontWeight: 800, color: scoreColor(sc) }}>{sc}%</div>
                          ) : (
                            <div style={{ fontSize: 13, color: 'var(--text-3)', fontWeight: 500 }}>Não auditado</div>
                          )}
                        </button>
                      );
                    })}
                  </div>
                </div>

                {progress.pct === 100 && (
                  <div className="card card-p" style={{ background: 'var(--green-light)', border: '1px solid #86efac' }}>
                    <div style={{ fontWeight: 700, color: 'var(--green)', marginBottom: 4 }}>🎉 Todos os setores verificados!</div>
                    <p style={{ fontSize: 13, color: 'var(--green)', marginBottom: 12 }}>Semana concluída com sucesso.</p>
                    <button className="btn btn-ghost btn-sm" onClick={() => { setWeekOffset(p => p + 1); DB.setConfig('weekOffset', weekOffset + 1); }}>
                      <I.Arrow /> Iniciar nova semana
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* ── INSPECTION ────────────────────────────────────────── */}
            {view === 'inspection' && (
              <div className="stack" style={{ gap: 16 }}>
                {/* Header */}
                <div className="card card-p">
                  <div className="row-between">
                    <div>
                      <div style={{ fontSize: 11, fontWeight: 600, color: 'var(--text-3)', textTransform: 'uppercase', letterSpacing: '.06em' }}>Setor</div>
                      <div style={{ fontSize: 20, fontWeight: 800, color: 'var(--text)' }}>{selectedSetor}</div>
                    </div>
                    <div style={{ textAlign: 'right' }}>
                      <div style={{ fontSize: 11, fontWeight: 600, color: 'var(--text-3)', textTransform: 'uppercase', letterSpacing: '.06em' }}>Nota (Gratificação)</div>
                      <div style={{ fontSize: 28, fontWeight: 800, color: scoreColor(scores.bonus) }}>{scores.bonus}%</div>
                    </div>
                  </div>
                  <div className="divider" style={{ margin: '12px 0' }} />
                  <div className="row" style={{ flexWrap: 'wrap', gap: 8 }}>
                    <span style={{ fontSize: 12, color: 'var(--text-3)' }}>Auditor: <strong style={{ color: 'var(--text)' }}>{responsavel}</strong></span>
                    <span style={{ fontSize: 12, color: 'var(--text-3)' }}>Data: <strong style={{ color: 'var(--text)' }}>{new Date(inspDate + 'T12:00:00').toLocaleDateString('pt-BR')}</strong></span>
                    <span style={{ fontSize: 12, color: 'var(--text-3)' }}>{answeredCount}/{currentQuestions.length} respondidas</span>
                  </div>
                </div>

                {/* Search */}
                <input type="text" value={inspSearch} onChange={e => setInspSearch(e.target.value)} placeholder="Buscar pergunta..." />

                {/* Questions */}
                {(() => {
                  const filtered = currentQuestions.filter(q => !inspSearch || q.pergunta.toLowerCase().includes(inspSearch.toLowerCase()) || q.grupo.toLowerCase().includes(inspSearch.toLowerCase()));
                  let currGrp = '';
                  return filtered.map(q => {
                    const showGrp = q.grupo !== currGrp;
                    if (showGrp) currGrp = q.grupo;
                    const isPrevNC = prevNCs[q.id] !== undefined;
                    return (
                      <React.Fragment key={q.id}>
                        {showGrp && !inspSearch && (
                          <div className="group-heading">{q.grupo}</div>
                        )}
                        <div className={`q-card ${answers[q.id] === 'C' ? 'is-c' : answers[q.id] === 'NC' ? 'is-nc' : ''}`}>
                          <div className="row" style={{ marginBottom: 10, flexWrap: 'wrap', gap: 4 }}>
                            {q.critical && <span className="badge badge-red">Crítico</span>}
                            {isPrevNC && <span className="badge badge-amber">NC anterior</span>}
                            <span style={{ fontSize: 11, color: 'var(--text-3)' }}>Peso {q.weight || 1}</span>
                          </div>
                          <p style={{ fontSize: 13, fontWeight: 500, color: 'var(--text)', marginBottom: 12, lineHeight: 1.5 }}>{q.pergunta}</p>
                          <div style={{ display: 'flex', gap: 6, marginBottom: answers[q.id] === 'NC' ? 10 : 0 }}>
                            {['C','NC','NA'].map(v => (
                              <button key={v} className={`answer-btn selected-${answers[q.id] === v ? v : ''}`}
                                onClick={() => setAnswers(p => ({ ...p, [q.id]: p[q.id] === v ? undefined : v }))}>
                                {v === 'C' ? '✓ Conforme' : v === 'NC' ? '✗ N. Conforme' : '— N/A'}
                              </button>
                            ))}
                          </div>
                          {answers[q.id] === 'NC' && (
                            <div className="stack" style={{ gap: 8, marginTop: 8 }}>
                              <div className="grid-2">
                                <div>
                                  <label className="field-label">Qtd. Ocorrências</label>
                                  <input type="number" min="1" value={ncQtys[q.id] || 1}
                                    onChange={e => setNcQtys(p => ({ ...p, [q.id]: parseInt(e.target.value) || 1 }))} />
                                </div>
                                <div>
                                  <label className="field-label">Fotos</label>
                                  <label style={{ display: 'flex', alignItems: 'center', gap: 6, cursor: 'pointer' }}>
                                    <span className="btn btn-ghost btn-sm" style={{ width: '100%', justifyContent: 'center' }}>
                                      <I.Camera /> {(evidences[q.id] || []).length > 0 ? `${(evidences[q.id] || []).length} foto(s)` : 'Adicionar'}
                                    </span>
                                    <input type="file" accept="image/*" capture="environment" style={{ display: 'none' }}
                                      onChange={e => handlePhotoUpload(q.id, e)} />
                                  </label>
                                </div>
                              </div>
                              {(evidences[q.id] || []).length > 0 && (
                                <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                                  {(evidences[q.id] || []).map((src, idx) => (
                                    <div key={idx} style={{ position: 'relative' }}>
                                      <img src={src} style={{ width: 56, height: 56, objectFit: 'cover', borderRadius: 4, cursor: 'pointer', border: '1px solid var(--border)' }}
                                        onClick={() => setLightboxSrc(src)} />
                                      <button onClick={() => setEvidences(p => ({ ...p, [q.id]: p[q.id].filter((_,i) => i !== idx) }))}
                                        style={{ position: 'absolute', top: -4, right: -4, background: 'var(--red)', color: '#fff', border: 'none', borderRadius: '50%', width: 16, height: 16, fontSize: 10, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>×</button>
                                    </div>
                                  ))}
                                </div>
                              )}
                              <div>
                                <label className="field-label">Observação</label>
                                <textarea value={obs[q.id] || ''} onChange={e => setObs(p => ({ ...p, [q.id]: e.target.value }))}
                                  rows="2" placeholder="Detalhe a não conformidade..." />
                              </div>
                              {isPrevNC && <div style={{ fontSize: 12, color: 'var(--amber-dark)', background: 'var(--amber-light)', padding: '6px 10px', borderRadius: 4 }}>NC anterior: {prevNCs[q.id] || 'sem obs.'}</div>}
                            </div>
                          )}
                        </div>
                      </React.Fragment>
                    );
                  });
                })()}

                {/* Signature + Actions */}
                <div className="card card-p stack" style={{ gap: 14 }}>
                  <div className="card-title">Assinatura do Responsável</div>
                  {signature
                    ? <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                        <img src={signature} style={{ height: 48, border: '1px solid var(--border)', borderRadius: 4 }} />
                        <button className="btn btn-ghost btn-sm" onClick={() => setSignature(null)}>Remover</button>
                      </div>
                    : <button className="btn btn-ghost btn-sm" style={{ alignSelf: 'flex-start' }} onClick={() => setIsSigning(true)}><I.Pen /> Assinar</button>
                  }
                </div>
                <div className="row" style={{ justifyContent: 'flex-end', gap: 8 }}>
                  <button className="btn btn-ghost btn-sm" onClick={() => { if (confirm('Cancelar? Os dados não salvos serão perdidos.')) { localStorage.removeItem('imac_draft'); setView('dashboard'); } }}>Cancelar</button>
                  <button className="btn btn-primary" onClick={handleSaveInspection}>Salvar Auditoria</button>
                </div>
              </div>
            )}

            {/* ── REPORT ────────────────────────────────────────────── */}
            {view === 'report' && reportInsp && (() => {
              const sc = reportInsp.bonusScore ?? reportInsp.score;
              const ncs = Object.entries(reportInsp.respostas || {}).filter(([,v]) => v === 'NC');
              return (
                <div className="stack" style={{ gap: 20 }}>
                  <div className="card card-p">
                    <div className="row-between">
                      <div>
                        <div style={{ fontSize: 11, color: 'var(--text-3)', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '.06em', marginBottom: 4 }}>Relatório de Auditoria</div>
                        <div style={{ fontSize: 22, fontWeight: 800 }}>{reportInsp.setor}</div>
                        <div style={{ fontSize: 12, color: 'var(--text-3)', marginTop: 4 }}>
                          {new Date(reportInsp.data).toLocaleDateString('pt-BR')} · {reportInsp.responsavel}
                        </div>
                      </div>
                      <div className="score-circle" style={{ background: scoreBg(sc), color: scoreColor(sc) }}>{sc}%</div>
                    </div>
                  </div>

                  {ncs.length === 0 ? (
                    <div className="card card-p" style={{ background: 'var(--green-light)', border: '1px solid #86efac' }}>
                      <div style={{ fontWeight: 700, color: 'var(--green)' }}>✓ Nenhuma não conformidade encontrada</div>
                    </div>
                  ) : (
                    <div className="card">
                      <div className="card-header"><span className="card-title">Não Conformidades ({ncs.length})</span></div>
                      {ncs.map(([qid]) => {
                        const q = questions.find(x => x.id === qid);
                        const evList = (reportInsp.evidencias?.[qid] || []).filter(Boolean);
                        return (
                          <div key={qid} style={{ padding: '14px 20px', borderBottom: '1px solid var(--border)' }}>
                            <div className="row" style={{ flexWrap: 'wrap', gap: 4, marginBottom: 6 }}>
                              <span className="badge badge-gray">{q?.grupo}</span>
                              {q?.critical && <span className="badge badge-red">Crítico</span>}
                            </div>
                            <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 4 }}>{q?.pergunta}</div>
                            {reportInsp.observacoes?.[qid] && <div style={{ fontSize: 12, color: 'var(--text-2)' }}>{reportInsp.observacoes[qid]}</div>}
                            {evList.length > 0 && (
                              <div style={{ display: 'flex', gap: 6, marginTop: 8, flexWrap: 'wrap' }}>
                                {evList.map((s, i) => <img key={i} src={s} style={{ width: 64, height: 64, objectFit: 'cover', borderRadius: 4, cursor: 'pointer', border: '1px solid var(--border)' }} onClick={() => setLightboxSrc(s)} />)}
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}

                  {reportInsp.assinatura && (
                    <div className="card card-p">
                      <div className="card-title" style={{ marginBottom: 10 }}>Assinatura</div>
                      <img src={reportInsp.assinatura} style={{ height: 60, border: '1px solid var(--border)', borderRadius: 4 }} />
                    </div>
                  )}

                  <div className="row" style={{ justifyContent: 'flex-end', gap: 8 }}>
                    <button className="btn btn-ghost btn-sm" onClick={() => window.print()}>Imprimir</button>
                    <button className="btn btn-primary btn-sm" onClick={() => setView('dashboard')}>Voltar ao Painel</button>
                  </div>
                </div>
              );
            })()}

            {/* ── ANALYTICS ─────────────────────────────────────────── */}
            {view === 'analytics' && (() => {
              const last30 = inspections.filter(i => {
                const d = new Date(i.data);
                return (new Date() - d) / 86400000 <= 30;
              });
              const bySetor = {};
              last30.forEach(i => {
                if (!bySetor[i.setor]) bySetor[i.setor] = { scores: [], ncs: 0 };
                bySetor[i.setor].scores.push(i.bonusScore ?? i.score);
                bySetor[i.setor].ncs += Object.values(i.respostas || {}).filter(v => v === 'NC').length;
              });
              const ranking = Object.entries(bySetor).map(([s, d]) => ({
                setor: s, avg: Math.round(d.scores.reduce((a,b) => a+b, 0) / d.scores.length), ncs: d.ncs
              })).sort((a, b) => b.avg - a.avg);

              return (
                <div className="stack" style={{ gap: 20 }}>
                  <div style={{ fontSize: 12, color: 'var(--text-3)' }}>Últimos 30 dias · {last30.length} auditorias</div>

                  <div className="grid-3">
                    <div className="card card-p"><div className="stat"><div className="stat-value">{last30.length}</div><div className="stat-label">Auditorias</div></div></div>
                    <div className="card card-p"><div className="stat"><div className="stat-value" style={{ color: 'var(--green)' }}>{last30.length > 0 ? Math.round(last30.reduce((a,i) => a + (i.bonusScore ?? i.score), 0) / last30.length) : 0}%</div><div className="stat-label">Média Geral</div></div></div>
                    <div className="card card-p"><div className="stat"><div className="stat-value" style={{ color: 'var(--red)' }}>{last30.reduce((a,i) => a + Object.values(i.respostas||{}).filter(v=>v==='NC').length, 0)}</div><div className="stat-label">Total NCs</div></div></div>
                  </div>

                  <div className="card">
                    <div className="card-header"><span className="card-title">Ranking por Setor</span></div>
                    <table>
                      <thead><tr><th>#</th><th>Setor</th><th>Média</th><th>NCs</th></tr></thead>
                      <tbody>
                        {ranking.length === 0 && <tr><td colSpan="4" style={{ textAlign: 'center', color: 'var(--text-3)' }}>Sem dados</td></tr>}
                        {ranking.map((r, i) => (
                          <tr key={r.setor}>
                            <td style={{ color: 'var(--text-3)', fontSize: 12 }}>{i + 1}</td>
                            <td style={{ fontWeight: 600, color: 'var(--text)' }}>{r.setor}</td>
                            <td><span className="badge" style={{ background: scoreBg(r.avg), color: scoreColor(r.avg) }}>{r.avg}%</span></td>
                            <td style={{ color: r.ncs > 0 ? 'var(--red)' : 'var(--text-3)' }}>{r.ncs}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              );
            })()}

            {/* ── ACTION PLANS ──────────────────────────────────────── */}
            {view === 'action_plans' && (
              <div className="stack" style={{ gap: 20 }}>
                <div className="grid-3">
                  {[['pending','Em andamento','badge-blue'],['overdue','Atrasados','badge-red'],['ok','Concluídos','badge-green']].map(([k,l,cls]) => (
                    <button key={k} className={`card card-p`} style={{ cursor: 'pointer', textAlign: 'left', border: apFilterStatus === k ? '1px solid var(--amber)' : '1px solid var(--border)' }}
                      onClick={() => setApFilterStatus(apFilterStatus === k ? 'all' : k)}>
                      <div style={{ fontSize: 24, fontWeight: 800, marginBottom: 4 }}>{apCounts[k] || 0}</div>
                      <span className={`badge ${cls}`}>{l}</span>
                    </button>
                  ))}
                </div>

                <div className="row">
                  <input type="text" style={{ flex: 1 }} value={apSearch} onChange={e => setApSearch(e.target.value)} placeholder="Buscar..." />
                  <select value={apFilterSetor} onChange={e => setApFilterSetor(e.target.value)} style={{ width: 160 }}>
                    <option value="all">Todos os setores</option>
                    {allSetors.map(s => <option key={s} value={s}>{s}</option>)}
                  </select>
                  <button className="btn btn-primary btn-sm" onClick={() => { setEditingAP(null); setShowAPModal(true); }}><I.Plus /> Novo</button>
                </div>

                <div className="card">
                  {filteredAPs.length === 0 && <div className="empty"><strong>Nenhum plano encontrado</strong></div>}
                  {filteredAPs.map(p => {
                    const st = apStatus(p);
                    return (
                      <div key={p.id} style={{ padding: '14px 20px', borderBottom: '1px solid var(--border)' }}>
                        <div className="row-between" style={{ marginBottom: 6 }}>
                          <div className="row" style={{ gap: 8 }}>
                            <span className="badge badge-gray">{p.setor}</span>
                            <span className={`badge ${apInfo[st].cls}`}>{apInfo[st].label}</span>
                          </div>
                          <div className="row" style={{ gap: 4 }}>
                            <button className="btn btn-ghost btn-sm btn-icon" onClick={() => { setEditingAP(p); setShowAPModal(true); }}><I.Edit /></button>
                            <button className="btn btn-ghost btn-sm btn-icon" onClick={async () => {
                              const updated = { ...p, dataConclusao: p.dataConclusao ? null : today };
                              await DB.saveActionPlan(updated);
                              toast(updated.dataConclusao ? 'Marcado como concluído.' : 'Plano reaberto.', 'success');
                            }}>{p.dataConclusao ? <I.X /> : <I.Check />}</button>
                            <button className="btn btn-danger btn-sm btn-icon" onClick={async () => { if (confirm('Excluir?')) { await DB.deleteActionPlan(p.id); toast('Excluído.'); } }}><I.Trash /></button>
                          </div>
                        </div>
                        <div style={{ fontSize: 13, fontWeight: 500, color: 'var(--text)', marginBottom: 4 }}>{p.descricao}</div>
                        <div style={{ fontSize: 12, color: 'var(--text-3)' }}>
                          Responsável: <strong style={{ color: 'var(--text-2)' }}>{p.responsavel}</strong> · Prazo: <strong style={{ color: st === 'overdue' ? 'var(--red)' : 'var(--text-2)' }}>{p.prazo ? new Date(p.prazo + 'T12:00:00').toLocaleDateString('pt-BR') : '—'}</strong>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* ── SETTINGS: HISTORY ─────────────────────────────────── */}
            {view === 'settings' && settingsTab === 'history' && (
              <div className="stack" style={{ gap: 16 }}>
                <input type="text" value={histSearch} onChange={e => setHistSearch(e.target.value)} placeholder="Buscar por setor ou auditor..." />
                <div className="card">
                  <table>
                    <thead>
                      <tr><th>Data</th><th>Setor</th><th>Auditor</th><th>Nota</th><th style={{ textAlign: 'right' }}>Ações</th></tr>
                    </thead>
                    <tbody>
                      {inspections
                        .filter(i => !histSearch || i.setor?.toLowerCase().includes(histSearch.toLowerCase()) || i.responsavel?.toLowerCase().includes(histSearch.toLowerCase()))
                        .sort((a, b) => new Date(b.data) - new Date(a.data))
                        .map(insp => {
                          const sc = insp.bonusScore ?? insp.score;
                          return (
                            <tr key={insp.id}>
                              <td style={{ fontSize: 12, whiteSpace: 'nowrap' }}>{new Date(insp.data).toLocaleDateString('pt-BR')}</td>
                              <td style={{ fontWeight: 600, color: 'var(--text)' }}>{insp.setor}</td>
                              <td>{insp.responsavel}</td>
                              <td><span className="badge" style={{ background: scoreBg(sc), color: scoreColor(sc) }}>{sc}%</span></td>
                              <td style={{ textAlign: 'right' }}>
                                <div className="row" style={{ justifyContent: 'flex-end', gap: 4 }}>
                                  <button className="btn btn-ghost btn-sm btn-icon" onClick={() => handleViewReport(insp)} title="Ver relatório"><I.Clipboard /></button>
                                  <button className="btn btn-ghost btn-sm btn-icon" onClick={() => handleEditInspection(insp)} title="Editar"><I.Edit /></button>
                                  <button className="btn btn-danger btn-sm btn-icon" onClick={() => handleDeleteInspection(insp.id)} title="Apagar"><I.Trash /></button>
                                </div>
                              </td>
                            </tr>
                          );
                        })}
                      {inspections.length === 0 && <tr><td colSpan="5" style={{ textAlign: 'center', color: 'var(--text-3)' }}>Nenhuma auditoria registrada.</td></tr>}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* ── SETTINGS: QUESTIONS ───────────────────────────────── */}
            {view === 'settings' && settingsTab === 'questions' && (
              <div className="stack" style={{ gap: 16 }}>
                <div className="row">
                  <input type="text" style={{ flex: 1 }} value={qSearch} onChange={e => setQSearch(e.target.value)} placeholder="Buscar pergunta..." />
                  <select value={qFilter} onChange={e => setQFilter(e.target.value)} style={{ width: 180 }}>
                    <option value="">Todos os setores</option>
                    {allSetors.map(s => <option key={s} value={s}>{s}</option>)}
                  </select>
                  <button className="btn btn-ghost btn-sm" onClick={() => setShowCloneModal(true)}><I.Copy /> Clonar Setor</button>
                  <button className="btn btn-primary btn-sm" onClick={() => { setEditingQ(null); setShowQModal(true); }}><I.Plus /> Nova</button>
                </div>

                {qFilter && !qSearch && <p style={{ fontSize: 12, color: 'var(--text-3)' }}>Arraste os itens para reordenar dentro do setor.</p>}

                <div className="card">
                  {(() => {
                    const qs = questions
                      .filter(q => (!qFilter || q.setor === qFilter) && (!qSearch || q.pergunta.toLowerCase().includes(qSearch.toLowerCase()) || q.grupo.toLowerCase().includes(qSearch.toLowerCase())))
                      .sort((a, b) => a.setor.localeCompare(b.setor) || a.grupo.localeCompare(b.grupo) || (a.ordem || 999) - (b.ordem || 999));
                    if (qs.length === 0) return <div className="empty"><strong>Nenhuma pergunta</strong>Clique em Nova para adicionar.</div>;
                    return qs.map(q => (
                      <div key={q.id} draggable={!!qFilter && !qSearch}
                        onDragStart={e => { setDraggedQ(q); e.dataTransfer.effectAllowed = 'move'; }}
                        onDragEnd={() => setDraggedQ(null)}
                        onDragOver={e => e.preventDefault()}
                        onDrop={e => handleDrop(e, q)}
                        style={{ padding: '12px 16px', borderBottom: '1px solid var(--border)', display: 'flex', alignItems: 'flex-start', gap: 10, cursor: qFilter && !qSearch ? 'grab' : 'default' }}>
                        {qFilter && !qSearch && <div className="drag-handle" style={{ marginTop: 2 }}><I.Grip /></div>}
                        <div style={{ flex: 1 }}>
                          <div className="row" style={{ gap: 4, flexWrap: 'wrap', marginBottom: 4 }}>
                            <span className="badge badge-gray">{q.setor}</span>
                            <span className="badge badge-amber">{q.grupo}</span>
                            {q.critical && <span className="badge badge-red">Crítico</span>}
                            <span style={{ fontSize: 11, color: 'var(--text-3)' }}>Peso {q.weight || 1} · Ordem {q.ordem || 999}</span>
                          </div>
                          <div style={{ fontSize: 13, color: 'var(--text)' }}>{q.pergunta}</div>
                        </div>
                        <div className="row" style={{ gap: 4, flexShrink: 0 }}>
                          <button className="btn btn-ghost btn-sm btn-icon" onClick={() => { setEditingQ(q); setShowQModal(true); }}><I.Edit /></button>
                          <button className="btn btn-danger btn-sm btn-icon" onClick={async () => { if (confirm('Apagar?')) { await DB.deleteQuestion(q.id); toast('Pergunta apagada.'); } }}><I.Trash /></button>
                        </div>
                      </div>
                    ));
                  })()}
                </div>
              </div>
            )}

            {/* ── SETTINGS: SYSTEM ──────────────────────────────────── */}
            {view === 'settings' && settingsTab === 'system' && (
              <div className="stack" style={{ gap: 20, maxWidth: 520 }}>
                <div className="card card-p stack" style={{ gap: 14 }}>
                  <div className="card-title">Logo da Empresa</div>
                  {logo && <img src={logo} style={{ height: 48, objectFit: 'contain', borderRadius: 4, border: '1px solid var(--border)' }} />}
                  <label>
                    <span className="btn btn-ghost btn-sm" style={{ display: 'inline-flex' }}>Alterar logo</span>
                    <input type="file" accept="image/*" style={{ display: 'none' }} onChange={e => {
                      const f = e.target.files[0]; if (!f) return;
                      const r = new FileReader();
                      r.onload = ev => { const d = ev.target.result; setLogo(d); DB.setConfig('logo', d); toast('Logo atualizado.', 'success'); };
                      r.readAsDataURL(f);
                    }} />
                  </label>
                </div>

                <div className="card card-p stack" style={{ gap: 14 }}>
                  <div className="card-title">Sincronização Google Sheets</div>
                  {SHEETS_WEBHOOK_URL ? (
                    <div style={{ fontSize: 13, color: 'var(--text-2)' }}>
                      <div className="row" style={{ gap: 8, marginBottom: 10 }}>
                        <span className="badge badge-green">Configurado</span>
                        <span style={{ fontSize: 12, color: 'var(--text-3)' }}>{SHEETS_WEBHOOK_URL.slice(0, 50)}...</span>
                      </div>
                      <p style={{ fontSize: 12, color: 'var(--text-3)', marginBottom: 12 }}>
                        Novas auditorias são enviadas automaticamente. Use o botão abaixo para migrar o histórico existente.
                      </p>
                      <button className="btn btn-primary btn-sm" onClick={handleMigrateToSheets} disabled={sheetsSyncStatus === 'syncing'}>
                        {sheetsSyncStatus === 'syncing' ? <><I.Refresh /> Migrando...</> : <><I.Sheets /> Migrar Histórico ({inspections.length} auditorias)</>}
                      </button>
                    </div>
                  ) : (
                    <div>
                      <p style={{ fontSize: 13, color: 'var(--text-2)', marginBottom: 12 }}>Para ativar a sincronização em tempo real com Google Sheets:</p>
                      <ol style={{ fontSize: 13, color: 'var(--text-2)', paddingLeft: 20, lineHeight: 2 }}>
                        <li>Abra <strong>Extensions → Apps Script</strong> na sua planilha</li>
                        <li>Cole o script fornecido e publique como <strong>Web App</strong></li>
                        <li>Copie a URL gerada e cole na variável <code style={{ background: 'var(--bg)', padding: '1px 4px', borderRadius: 3 }}>SHEETS_WEBHOOK_URL</code> no código HTML</li>
                      </ol>
                    </div>
                  )}
                </div>

                <div className="card card-p stack" style={{ gap: 14 }}>
                  <div className="card-title">Conta</div>
                  <div style={{ fontSize: 13, color: 'var(--text-2)' }}>
                    <strong>{user?.displayName}</strong> · {user?.email}
                  </div>
                  <button className="btn btn-ghost btn-sm" style={{ alignSelf: 'flex-start' }} onClick={handleLogout}><I.Logout /> Sair</button>
                </div>
              </div>
            )}

          </div>
        </div>
      </div>
    </React.Fragment>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ToastProvider><App /></ToastProvider>);
</script>
</body>
</html>
